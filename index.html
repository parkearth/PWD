<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>臺北街頭槍戰</title>
<style>html,body{margin:0;height:100%;background:#07080c;overflow:hidden;touch-action:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script></head><body>
<script>
const W=360,H=640,GY=250;
const TC=[0,0xffffff,0x66ff66,0x55aaff,0xcc55ff,0xffcc33];
const WEAPONS=[null,
 {n:'手槍',d:1,r:380,s:420,p:1,c:0xffffff},
 {n:'衝鋒槍',d:1,r:120,s:460,p:1,c:0x66ff66,sp:.12},
 {n:'霰彈槍',d:1,r:560,s:380,p:5,c:0x55aaff,sp:.6,life:500},
 {n:'雷射槍',d:3,r:240,s:620,p:1,c:0xcc55ff,pierce:1},
 {n:'電漿砲',d:7,r:420,s:500,p:3,c:0xffcc33,sp:.25,pierce:1,big:1}];
const PAL={k:'#111',w:'#fff',b:'#3b8cff',B:'#1a4fb0',r:'#e03a3a',R:'#8a1c1c',y:'#fc3',s:'#f1c9a0',d:'#222',o:'#f80',g:'#667'};
const PIX=[
['p',["..dddd..",".dssssd.",".dskssk.",".dssssd.","..ssss..",".bbbbbb.","bbbbbbbb","sbbbbbbs",".bbbbbb.",".dd..dd.",".dd..dd.",".kk..kk."]],
['bird',["...bb.....","..bbbb....",".bbwkbb...",".bbbbbboo.","bbbbbbb...","BbbbbbbB..",".BbbbbB...","..BBBB....","...o.o....","...o.o...."]],
['bear',[".rr....rr...","rrrr..rrrr..",".rrrrrrrr...",".rrwkrwkr...",".rrrrrrrr...",".rrrkkrrr...","..rrrrrr....",".rrrrrrrr...","rrrrrrrrrr..","rr.rrrr.rr..","rr.rrrr.rr..","RR......RR.."]],
['boss',["..ddddsddd..",".dddddsdddd.",".dssssssssd.",".dskssssksd.",".dssssssssd.","..sssRRsss..","...ssssss...","..wwwrrwww..",".kkkwrrwkkk.","kkkkkrrkkkkk","kkkkkrrkkkkk","skkkkkkkkkks",".kkkkkkkkkk.",".kkkk..kkkk.",".kkkk..kkkk.",".dddd..dddd."]]];
function mk(sc,key,rows,px){const t=sc.textures.createCanvas(key,rows[0].length*px,rows.length*px),x=t.getContext();
 rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const c=PAL[ch];if(c){x.fillStyle=c;x.fillRect(i*px,j*px,px,px)}}));t.refresh()}
// ---- 音效（WebAudio 合成，可開關）----
let AC,mute=localStorage.getItem('mute')==='1';
function beep(f,d,type='square',v=.05){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const ST={fontSize:'14px',color:'#fff',stroke:'#000',strokeThickness:3};

class Game extends Phaser.Scene{
 create(){
  PIX.forEach(([k,r])=>mk(this,k,r,3));mk(this,'dot',['ww','ww'],2);
  this.bg();
  this.p=this.add.sprite(W/2,520,'p').setOrigin(.5,1);
  Object.assign(this,{hp:5,own:[0,1,0,0,0,0],cur:1,score:0,en:[],bl:[],eb:[],dr:[],t:0,nf:0,ns:0,nb:300000,inv:0,over:false,jp:-1,jo:{x:0,y:0}});
  this.gf=this.add.graphics().setDepth(999);
  this.ht=this.add.text(8,6,'',ST).setDepth(1000);
  this.mt=this.add.text(W/2,150,'',{fontSize:'20px',color:'#ffdd55',stroke:'#000',strokeThickness:4}).setOrigin(.5).setDepth(1000).setAlpha(0);
  this.mb=this.add.text(W-8,6,mute?'🔇':'🔊',{fontSize:'22px'}).setOrigin(1,0).setDepth(1000).setInteractive();
  this.mb.on('pointerdown',()=>{mute=!mute;localStorage.setItem('mute',mute?'1':'0');this.mb.setText(mute?'🔇':'🔊')});
  this.slots=[1,2,3,4,5].map(i=>{const x=130+(i-1)*42,y=H-28;
   const r=this.add.rectangle(x,y,36,36,0x111111).setStrokeStyle(3,TC[i]).setInteractive().setDepth(1000);
   const n=this.add.text(x,y,i,{fontSize:'16px',color:hex(TC[i])}).setOrigin(.5).setDepth(1001);
   r.on('pointerdown',()=>{if(this.own[i])this.cur=i});return {r,n}});
  this.k=this.input.keyboard.addKeys('W,A,S,D');this.cu=this.input.keyboard.createCursorKeys();
  this.input.keyboard.on('keydown',e=>{const n=+e.key;if(n>=1&&n<=5&&this.own[n])this.cur=n});
  this.input.on('pointerdown',(p,o)=>{
   AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
   if(this.over&&performance.now()-this.overT>800){this.scene.restart();return}
   if(o.length||p.x>W*.6)return;this.jp=p.id;this.jo={x:p.x,y:p.y}});
  this.msg('在臺北街頭生存！');
 }
 bg(){const g=this.add.graphics().setDepth(-10);
  g.fillGradientStyle(0x0b1030,0x0b1030,0x3a2a5a,0x3a2a5a,1).fillRect(0,0,W,GY);
  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<14;i++){const w=30+R()*30,h=40+R()*90,x=i*28-10;
   g.fillStyle(0x151a33).fillRect(x,GY-60-h,w,h+60);g.fillStyle(0xffd86b);
   for(let k=0;k<9;k++)g.fillRect(x+4+R()*(w-10),GY-60-h+8+R()*h,3,3)}
  g.fillStyle(0x2a9d8f);for(let i=0;i<8;i++){const w=i%2?26:34;g.fillRect(270-w/2,GY-80-i*20,w,18)}
  g.fillRect(257,GY-80,26,20);g.fillStyle(0x7fe3d3).fillRect(269,GY-250,2,30);
  g.fillStyle(0x3b2f2f).fillRect(0,GY-60,W,60);
  [['西門町',8,0xc0392b],['夜市',100,0xd68910],['珍奶',170,0x1e8449],['臺北',250,0x2471a3]].forEach(([t,x,c])=>
   this.add.text(x,GY-50,t,{fontSize:'15px',color:'#fff',backgroundColor:hex(c),padding:{x:4,y:2}}).setDepth(-9));
  g.fillStyle(0x2b2d36).fillRect(0,GY,W,H-GY);g.fillStyle(0x5a5a66).fillRect(0,GY,W,26);
  g.fillStyle(0xdddddd);for(let x=0;x<W;x+=40)g.fillRect(x,GY+240,22,3);
  for(let x=60;x<W-40;x+=34)g.fillRect(x,GY+120,16,56)}
 msg(s){this.mt.setText(s).setAlpha(1);this.tweens.add({targets:this.mt,alpha:0,delay:1500,duration:600})}
 fire(a){const w=WEAPONS[this.cur];beep(300+this.cur*120,.06);
  for(let i=0;i<w.p;i++){const aa=a+(Math.random()-.5)*(w.sp||0);
   const b=this.add.sprite(this.p.x,this.p.y-20,'dot').setTint(w.c).setScale(w.big?4:1.6).setDepth(950);
   Object.assign(b,{vx:Math.cos(aa)*w.s,vy:Math.sin(aa)*w.s,d:w.d,pi:w.pierce,life:w.life||900,hit:new Set()});this.bl.push(b)}}
 spawn(k){const m=this.t/60000,r=Math.random();let x,y;
  if(k==='boss'){x=W/2;y=GY+30}
  else if(r<.4){x=-20;y=GY+40+Math.random()*(H-GY-110)}
  else if(r<.8){x=W+20;y=GY+40+Math.random()*(H-GY-110)}else{x=Math.random()*W;y=GY+10}
  let key,hp,sp,sc=1,cls=0;
  if(k==='boss'){key='boss';hp=400;sp=38;sc=2.6;cls=3}
  else{const bird=Math.random()<.5,q=Math.random();key=bird?'bird':'bear';hp=bird?2:4;sp=bird?75:48;
   cls=q<Math.min(.07,.01+m*.01)?2:q<Math.min(.3,.06+m*.03)?1:0;
   sc=[1,1.8,2.8][cls];hp=hp*[1,4,10][cls]*(1+m*.15);sp*=[1,.8,.65][cls]}
  const e=this.add.sprite(x,y,key).setOrigin(.5,1).setScale(sc);
  Object.assign(e,{hp,mhp:hp,sp,cls,boss:k==='boss',rr:e.displayWidth*.38,nx:this.t+2000,dead:false});this.en.push(e)}
 dmg(e,n){e.hp-=n;if(e.hp<=0)return this.kill(e);beep(180,.04,'sawtooth');
  e.setTint(0xff9999);this.time.delayedCall(60,()=>e.active&&e.clearTint())}
 kill(e){e.dead=true;const c=e.cls,q=Math.random();let tier=0;
  if(c===0&&q<.22)tier=Math.random()<.75?1:2;
  if(c===1)tier=[2,2,3,3,4][Math.random()*5|0];
  if(c===2)tier=[3,4,4,5][Math.random()*4|0];
  if(c===3)tier=5;
  this.score+=[10,50,200,1000][c];beep(90,.12,'sawtooth',.07);
  if(tier){const d=this.add.text(e.x,e.y-14,'★'+tier,{fontSize:'18px',color:hex(TC[tier]),stroke:'#000',strokeThickness:4}).setOrigin(.5).setDepth(900);
   Object.assign(d,{by:e.y-14,tier,dl:this.t+15000});this.dr.push(d)}
  e.destroy()}
 hurt(){this.hp--;this.inv=this.t+1000;beep(120,.25,'sawtooth',.08);
  this.p.setTint(0xff4444);this.time.delayedCall(150,()=>this.p.clearTint());
  if(this.hp<=0){this.over=true;this.overT=performance.now();
   const best=Math.max(this.score,+localStorage.getItem('best')||0);localStorage.setItem('best',best);
   this.add.text(W/2,H/2-40,'你倒下了\n分數 '+this.score+'\n最高 '+best+'\n\n點一下重新開始',{fontSize:'22px',color:'#fff',align:'center',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(2000)}}
 update(_,dt){
  if(this.over)return;this.t+=dt;const t=this.t,p=this.p,d=dt/1000;
  let mx=0,my=0;const K=this.k,C=this.cu;
  if(K.A.isDown||C.left.isDown)mx--;if(K.D.isDown||C.right.isDown)mx++;
  if(K.W.isDown||C.up.isDown)my--;if(K.S.isDown||C.down.isDown)my++;
  const gf=this.gf.clear();
  const q=this.input.manager.pointers.find(z=>z.id===this.jp&&z.isDown);
  if(q){const dx=q.x-this.jo.x,dy=q.y-this.jo.y,m=Math.hypot(dx,dy),c=Math.min(m,40);
   if(m>8){mx=dx/m*c/40;my=dy/m*c/40}
   gf.lineStyle(2,0xffffff,.4).strokeCircle(this.jo.x,this.jo.y,40).fillStyle(0xffffff,.5)
    .fillCircle(this.jo.x+(m?dx/m*c:0),this.jo.y+(m?dy/m*c:0),14)}
  const L=Math.hypot(mx,my);if(L>1){mx/=L;my/=L}
  p.x=Phaser.Math.Clamp(p.x+mx*130*d,16,W-16);p.y=Phaser.Math.Clamp(p.y+my*130*d,GY+40,H-70);
  if(mx)p.flipX=mx<0;p.setDepth(p.y);p.alpha=(t<this.inv&&((t/80)|0)%2)?.4:1;
  // 自動瞄準最近的怪物、無限彈藥
  let ne=null,nd=1e9;for(const e of this.en){const dd=Math.hypot(e.x-p.x,e.y-p.y);if(dd<nd){nd=dd;ne=e}}
  const w=WEAPONS[this.cur];
  if(ne&&t>this.nf){this.nf=t+w.r;this.fire(Math.atan2(ne.y-ne.displayHeight/2-(p.y-20),ne.x-p.x))}
  // 子彈
  for(const b of this.bl){b.x+=b.vx*d;b.y+=b.vy*d;b.life-=dt;
   for(const e of this.en){if(e.dead||b.hit.has(e))continue;
    if(Math.hypot(e.x-b.x,e.y-e.displayHeight/2-b.y)<e.rr){b.hit.add(e);this.dmg(e,b.d);if(!b.pi){b.life=0;break}}}}
  this.bl=this.bl.filter(b=>{if(b.life<=0||b.x<-20||b.x>W+20||b.y<0||b.y>H+20){b.destroy();return false}return true});
  this.en=this.en.filter(e=>!e.dead);
  // 怪物
  for(const e of this.en){const dx=p.x-e.x,dy=p.y-6-e.y,m=Math.hypot(dx,dy)||1;
   e.x+=dx/m*e.sp*d;e.y+=dy/m*e.sp*d;e.flipX=dx<0;e.setDepth(e.y);
   if(e.boss&&t>e.nx){e.nx=t+2500;beep(70,.3,'square',.08);
    for(let i=0;i<10;i++){const a=i/10*6.283+t/500,s=this.add.sprite(e.x,e.y-e.displayHeight/2,'dot').setTint(0xff3333).setScale(2.5).setDepth(950);
     Object.assign(s,{vx:Math.cos(a)*110,vy:Math.sin(a)*110,life:4000});this.eb.push(s)}}
   if(m<e.rr+10&&t>this.inv)this.hurt()}
  for(const s of this.eb){s.x+=s.vx*d;s.y+=s.vy*d;s.life-=dt;
   if(Math.hypot(s.x-p.x,s.y-p.y+18)<14&&t>this.inv){s.life=0;this.hurt()}}
  this.eb=this.eb.filter(s=>{if(s.life<=0||s.x<-20||s.x>W+20||s.y<0||s.y>H+20){s.destroy();return false}return true});
  // 掉落
  for(const o of this.dr){o.y=o.by+Math.sin(t/200)*3;
   if(Math.hypot(o.x-p.x,o.y-p.y+18)<26){o.dl=0;const n=o.tier;
    if(!this.own[n]){this.own[n]=1;if(n>this.cur)this.cur=n;this.msg('獲得 '+WEAPONS[n].n+'！')}else this.score+=50*n;beep(700+n*100,.15,'triangle',.07)}}
  this.dr=this.dr.filter(o=>{if(t>o.dl){o.destroy();return false}return true});
  // 生怪與 BOSS（每 5 分鐘一隻）
  if(t>this.ns){this.ns=t+Math.max(450,1300-t/90);this.spawn()}
  if(t>this.nb){this.nb+=300000;this.spawn('boss');this.msg('⚠ 中分頭西裝男登場！');beep(60,.6,'sawtooth',.1)}
  const bo=this.en.find(e=>e.boss);
  if(bo)gf.fillStyle(0,.6).fillRect(60,48,240,8).fillStyle(0xe03a3a).fillRect(60,48,240*Math.max(0,bo.hp/bo.mhp),8);
  // HUD
  const sec=t/1000|0;
  this.ht.setText('♥'.repeat(Math.max(0,this.hp))+'\n分數 '+this.score+'　'+(sec/60|0)+':'+String(sec%60).padStart(2,'0')+'\n'+w.n+' Lv'+this.cur);
  this.slots.forEach((s,i)=>{const n=i+1;s.r.setFillStyle(this.cur===n?TC[n]:0x111111,this.cur===n?.5:1);s.r.setAlpha(this.own[n]?1:.3);s.n.setAlpha(this.own[n]?1:.3)});
 }
}
new Phaser.Game({type:Phaser.AUTO,width:W,height:H,backgroundColor:'#07080c',pixelArt:true,
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:3},scene:Game});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
